<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Number Slider</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Trebuchet MS", sans-serif;
    background: linear-gradient(160deg, #7ad7f0 0%, #b388eb 100%);
    display: flex; flex-direction: column; align-items: center;
    color: #2b2b52; overflow: hidden; touch-action: manipulation;
  }
  header {
    width: 100%; max-width: 640px; display: flex; align-items: center;
    justify-content: space-between; padding: 10px 14px; gap: 8px;
  }
  .home {
    text-decoration: none; font-size: 28px; background: #fff; border-radius: 16px;
    width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 0 rgba(0,0,0,.15);
  }
  h1 { margin: 0; font-size: clamp(22px, 5vw, 34px); color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.2); }
  .stats { display: flex; gap: 10px; margin: 4px 0 10px; }
  .stat {
    background: rgba(255,255,255,.9); border-radius: 14px; padding: 6px 14px;
    font-size: clamp(16px, 3.6vw, 22px); font-weight: bold; box-shadow: 0 4px 0 rgba(0,0,0,.12);
  }
  #board {
    position: relative;
    width: min(92vw, calc(100vh - 230px), 560px);
    height: min(92vw, calc(100vh - 230px), 560px);
    background: #4a3f8c; border-radius: 22px; padding: 2%;
    box-shadow: 0 8px 0 rgba(0,0,0,.2);
  }
  .tile {
    position: absolute; border-radius: 16%;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.25);
    box-shadow: inset 0 -6px 0 rgba(0,0,0,.18);
    transition: left .14s ease, top .14s ease, transform .1s;
    cursor: pointer;
  }
  .tile.home-spot { box-shadow: inset 0 -6px 0 rgba(0,0,0,.18), 0 0 0 4px #fff7a8; }
  .tile:active { transform: scale(.95); }
  .controls { display: flex; gap: 12px; margin: 14px 0; flex-wrap: wrap; justify-content: center; }
  button {
    font-family: inherit; font-size: clamp(16px, 3.8vw, 22px); font-weight: bold;
    border: none; border-radius: 18px; padding: 12px 20px; cursor: pointer;
    background: #fff; color: #4a3f8c; box-shadow: 0 5px 0 rgba(0,0,0,.18);
  }
  button:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.18); }
  button.on { background: #ffd23f; }
  #win {
    position: fixed; inset: 0; background: rgba(43,43,82,.6);
    display: none; align-items: center; justify-content: center; z-index: 10;
  }
  #win.show { display: flex; }
  .card {
    background: #fff; border-radius: 28px; padding: 28px 34px; text-align: center;
    box-shadow: 0 10px 0 rgba(0,0,0,.2); animation: pop .4s ease;
  }
  .card .big { font-size: 64px; }
  .card h2 { margin: 6px 0; font-size: 34px; color: #e2508c; }
  .card p { font-size: 20px; margin: 6px 0 18px; }
  .card button { background: #5bd17a; color: #fff; }
  @keyframes pop { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .confetti { position: fixed; top: -20px; width: 12px; height: 18px; z-index: 11; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
</style>
</head>
<body>
  <header>
    <a class="home" href="../" aria-label="Home">🏠</a>
    <h1>Number Slider</h1>
    <div style="width:52px"></div>
  </header>

  <div class="stats">
    <div class="stat">Moves: <span id="moves">0</span></div>
    <div class="stat">⏱ <span id="time">0:00</span></div>
  </div>

  <div id="board"></div>

  <div class="controls">
    <button id="size3">Easy 3×3</button>
    <button id="size4" class="on">Big 4×4</button>
    <button id="shuffle">🔀 New Game</button>
  </div>

  <div id="win">
    <div class="card">
      <div class="big">🎉</div>
      <h2>You did it!</h2>
      <p id="winText"></p>
      <button id="again">Play Again</button>
    </div>
  </div>

<script>
  const board = document.getElementById('board');
  const movesEl = document.getElementById('moves');
  const timeEl = document.getElementById('time');
  const colors = ['#ff6b6b','#ff9f43','#feca57','#1dd1a1','#48dbfb','#54a0ff','#5f27cd','#ff6bcb',
                  '#ee5253','#10ac84','#0abde3','#f368e0','#ff9ff3','#00d2d3','#576574'];

  let N = 4, grid = [], tiles = {}, moves = 0, seconds = 0, timer = null, playing = false;

  function startTimer() {
    if (timer) return;
    timer = setInterval(() => { seconds++; showTime(); }, 1000);
  }
  function stopTimer() { clearInterval(timer); timer = null; }
  function showTime() {
    timeEl.textContent = Math.floor(seconds / 60) + ':' + String(seconds % 60).padStart(2, '0');
  }

  function build() {
    board.innerHTML = ''; tiles = {};
    const gap = 2;                 // % gap between tiles
    const size = (96 - gap * (N - 1)) / N;  // board has 2% padding each side
    for (let v = 1; v < N * N; v++) {
      const t = document.createElement('div');
      t.className = 'tile';
      t.textContent = v;
      t.style.width = t.style.height = size + '%';
      t.style.fontSize = (N === 3 ? 'min(13vw, 13vh, 80px)' : 'min(9vw, 9vh, 58px)');
      t.style.background = colors[(v - 1) % colors.length];
      t.addEventListener('pointerdown', e => { e.preventDefault(); tap(v); });
      board.appendChild(t);
      tiles[v] = t;
    }
    board._size = size; board._gap = gap;
  }

  function place() {
    const s = board._size, g = board._gap;
    grid.forEach((v, i) => {
      if (!v) return;
      const r = Math.floor(i / N), c = i % N;
      const t = tiles[v];
      t.style.left = (2 + c * (s + g)) + '%';
      t.style.top  = (2 + r * (s + g)) + '%';
      t.classList.toggle('home-spot', v === i + 1);
    });
  }

  function newGame() {
    stopTimer(); seconds = 0; moves = 0; showTime(); movesEl.textContent = 0;
    grid = [...Array(N * N - 1).keys()].map(x => x + 1).concat(0);
    // Shuffle with random legal moves so it is always solvable
    let empty = N * N - 1, last = -1;
    const steps = N === 3 ? 150 : 400;
    for (let k = 0; k < steps; k++) {
      const opts = neighbors(empty).filter(n => n !== last);
      const pick = opts[Math.floor(Math.random() * opts.length)];
      grid[empty] = grid[pick]; grid[pick] = 0;
      last = empty; empty = pick;
    }
    if (solved()) return newGame();
    build(); place(); playing = true;
  }

  function neighbors(i) {
    const r = Math.floor(i / N), c = i % N, out = [];
    if (r > 0) out.push(i - N);
    if (r < N - 1) out.push(i + N);
    if (c > 0) out.push(i - 1);
    if (c < N - 1) out.push(i + 1);
    return out;
  }

  // Tap any tile in the same row or column as the gap: it (and the tiles between) slide over
  function tap(v) {
    if (!playing) return;
    const i = grid.indexOf(v), e = grid.indexOf(0);
    const ri = Math.floor(i / N), ci = i % N, re = Math.floor(e / N), ce = e % N;
    let step;
    if (ri === re) step = ci < ce ? -1 : 1;
    else if (ci === ce) step = ri < re ? -N : N;
    else { wiggle(tiles[v]); return; }
    let gap = e;
    while (gap !== i) {
      const next = gap + step;
      grid[gap] = grid[next]; grid[next] = 0; gap = next;
    }
    moves++; movesEl.textContent = moves;
    startTimer(); place();
    if (solved()) win();
  }

  function wiggle(t) {
    t.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(-8deg)' }, { transform: 'rotate(8deg)' }, { transform: 'rotate(0)' }], { duration: 250 });
  }

  function solved() {
    for (let i = 0; i < N * N - 1; i++) if (grid[i] !== i + 1) return false;
    return true;
  }

  function win() {
    playing = false; stopTimer();
    document.getElementById('winText').textContent = `${moves} moves in ${timeEl.textContent}`;
    setTimeout(() => {
      document.getElementById('win').classList.add('show');
      confetti();
    }, 300);
  }

  function confetti() {
    for (let k = 0; k < 60; k++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[k % colors.length];
      c.style.animationDuration = (1.5 + Math.random() * 2) + 's';
      c.style.animationDelay = Math.random() * .5 + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 4500);
    }
  }

  function setSize(n) {
    N = n;
    document.getElementById('size3').classList.toggle('on', n === 3);
    document.getElementById('size4').classList.toggle('on', n === 4);
    newGame();
  }

  document.getElementById('size3').onclick = () => setSize(3);
  document.getElementById('size4').onclick = () => setSize(4);
  document.getElementById('shuffle').onclick = newGame;
  document.getElementById('again').onclick = () => {
    document.getElementById('win').classList.remove('show'); newGame();
  };

  newGame();
</script>
</body>
</html>
